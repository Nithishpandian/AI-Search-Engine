  services:
    backend:
      build: ./server
      ports: 
        - "8000:8000"
      env_file:
        - ./server/.env
      volumes:
        - ./server:/app

    frontend:
      build: ./client
      ports:
        - "3000:3000"
      env_file:
        - ./client/.env.local
      volumes:
        - ./client:/app
        - /app/node_modules