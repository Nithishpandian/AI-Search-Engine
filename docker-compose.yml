  services:
    redis:
      image: redis:7-alpine
      ports:
        - "6379:6379"

    backend:
      build: ./server
      ports: 
        - "8000:8000"
      env_file:
        - ./server/.env
      volumes:
        - ./server:/app
      depends_on:
        - redis

    frontend:
      build: ./client
      ports:
        - "3000:3000"
      env_file:
        - ./client/.env.local
      volumes:
        - ./client:/app
        - /app/node_modules